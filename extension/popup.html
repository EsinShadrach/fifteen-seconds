<!doctype html>
<meta charset="utf-8">
<title>Fifteen Seconds</title>
<style>
  body{width:270px;margin:0;padding:14px;background:#161C25;color:#ECEFF3;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:13px;}
  h1{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#8C97AA;margin:0 0 12px;font-weight:600;}
  label{display:block;margin-bottom:12px;}
  .lbl{display:block;font-size:11px;color:#8C97AA;margin-bottom:5px;letter-spacing:.06em;text-transform:uppercase;}
  input[type=text],input[type=number]{width:100%;box-sizing:border-box;background:#1E2631;color:#ECEFF3;
    border:1.5px solid #293340;border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit;}
  input:focus{outline:none;border-color:#F2AB3E;}
  .row{display:flex;align-items:center;gap:9px;margin-bottom:12px;cursor:pointer;}
  .row input{accent-color:#F2AB3E;width:16px;height:16px;cursor:pointer;flex:none;}
  .hint{color:#8C97AA;font-size:11px;line-height:1.45;margin:-6px 0 12px 25px;}
  .saved{color:#4FD0B9;font-size:11px;height:14px;}
  .cues{display:flex;gap:6px;margin:-4px 0 12px 25px;}
  .cues button{flex:1;background:#1E2631;color:#8C97AA;border:1.5px solid #293340;border-radius:7px;
    padding:6px 0;font-size:10px;font-family:inherit;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;}
  .cues button:hover{border-color:#F2AB3E;color:#ECEFF3;}
  .cues button:active{background:#293340;}
</style>
<h1>Fifteen Seconds</h1>

<label>
  <span class="lbl">Your name in the turn line</span>
  <input type="text" id="handle" placeholder="Rafe" autocomplete="off">
</label>

<label class="row"><input type="checkbox" id="enabled"><span>Watch for prompts</span></label>

<label class="row"><input type="checkbox" id="autoSend"><span>Send automatically</span></label>
<div class="hint">Off by default: the word is typed into the box and you press Enter. Turn this on only once you trust the picks - a wrong auto-send cannot be taken back.</div>

<label>
  <span class="lbl">Wait before auto-sending (ms)</span>
  <input type="number" id="delayMs" min="0" max="15000" step="100">
</label>

<label class="row"><input type="checkbox" id="sound"><span>8-bit sounds</span></label>
<div class="hint">A blip on each auto-send, a fanfare when you win, and a game-over slide when you are knocked out.</div>

<div class="cues">
  <button data-cue="send">send</button>
  <button data-cue="win">win</button>
  <button data-cue="lose">lose</button>
  <button data-cue="out">rival out</button>
</div>

<div class="saved" id="saved"></div>
<script src="popup.js"></script>
